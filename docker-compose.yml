services:
  app:
    build:
      context: .
      args:
        - DEV=true
    ports:
      - "8001:8001" # Correct list format
    volumes:
      - ./app:/app # Correct list format
      - dev-static-data:/vol/web
    command: >
      sh -c "python manage.py wait_for_db && 
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"  # Correct indentation and syntax
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
    networks:
      app-network:
    depends_on:
      - db

  db:
    image: postgres:13-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
    networks:
      app-network:
    ports:
      - "5432:5432"

volumes:
  dev-db-data:
  dev-static-data:


networks:
  app-network:
    driver: bridge
